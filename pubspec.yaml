name: mihrab_app
description: "مِحْراب: مواقيت الصلاة والقرآن في الجزائر - أذكار، قرآن كريم، بوصلة القبلة، بلديات الجزائر، بث مباشر"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  shared_preferences: ^2.2.2
  sensors_plus: ^5.0.1
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  audioplayers: ^6.0.0
  geolocator: ^12.0.0
  flutter_local_notifications: ^22.3.1
  url_launcher: ^6.3.3
  timezone: ^0.11.1
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/audio/
    - assets/audio/abdulbasit_3_39.mp3
